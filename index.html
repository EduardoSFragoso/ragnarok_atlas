<!doctype html>
<html lang="pt-BR" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#f4f6f7" />
        <!-- Aplica o tema salvo ANTES do primeiro paint para evitar flash de tema. -->
        <script>
            (function () {
                try {
                    var t = localStorage.getItem("ro-atlas-theme");
                    if (t !== "light" && t !== "dark") t = "light";
                    document.documentElement.dataset.theme = t;
                } catch (e) {
                    document.documentElement.dataset.theme = "light";
                }
            })();
        </script>
        <meta
            name="description"
            content="Guia comunitário de equipamentos, encantamentos, reformas e calculadoras para Ragnarök Online LATAM."
        />
        <!-- Open Graph / Twitter (imagens e textos para compartilhamento) -->
        <meta property="og:title" content="Ragnarök Atlas — guia LATAM" />
        <meta
            property="og:description"
            content="Guia comunitário de equipamentos, encantamentos, reformas e calculadoras para Ragnarök Online LATAM."
        />
        <meta property="og:image" content="assets/favicon.svg" />
        <meta name="twitter:card" content="summary" />
        <title>Ragnarök Atlas — guia LATAM</title>
        <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css?v=b166b6c4" />
    </head>
    <body>
        <div class="app-shell">
            <aside class="sidebar">
                <nav class="nav-list" aria-label="Navegação principal">
                    <button class="nav-link active" data-view="inicio"><span>⌂</span> Visão geral</button>
                    <button class="nav-link" data-view="guia"><span>❖</span> Guia de Episódio</button>
                    <button class="nav-link" data-view="diarias"><span>⟳</span> Missões diárias</button>
                    <button class="nav-link" data-view="equipamentos"><span>◈</span> Equipamentos</button>
                    <button class="nav-link" data-view="encantamentos"><span>✳</span> Encantamentos</button>
                    <button class="nav-link" data-view="custos"><span>◇</span> Custos & materiais</button>
                    <button class="nav-link" data-view="reformas"><span>↗</span> Reforma de armas</button>
                    <button class="nav-link" data-view="grau"><span>⬆</span> Grau & Refinamento</button>
                    <button class="nav-link" data-view="reciclagem"><span>♻</span> Reciclagem e Globos</button>
                    <button class="nav-link" data-view="calculadoras"><span>∑</span> Calculadoras</button>
                    <button class="nav-link" data-view="fontes"><span>↗</span> Fontes & referências</button>
                </nav>
            </aside>
            <main class="main-area">
                <header class="topbar">
                    <div class="breadcrumb"><b id="crumb">VISÃO GERAL</b></div>
                    <label class="global-search" for="globalSearch">
                        <span aria-hidden="true">⌕</span>
                        <input
                            id="globalSearch"
                            type="search"
                            aria-label="Busca global"
                            placeholder="Buscar equipamento, material ou episódio…"
                        />
                        <kbd aria-hidden="true">/</kbd>
                    </label>
                    <button
                        class="theme-toggle"
                        id="themeToggle"
                        type="button"
                        aria-label="Ativar modo escuro"
                        title="Ativar modo escuro"
                    >
                        ☾ <span>Modo escuro</span>
                    </button>
                    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu" aria-expanded="false">
                        ☰
                    </button>
                </header>
                <div id="loadBanner" class="load-banner" role="status" hidden></div>
                <div id="content" class="content">
                    <div class="loading" role="status"><span class="spinner"></span> Carregando a biblioteca…</div>
                </div>
            </main>
        </div>
        <!-- Scrim do menu móvel: cobre o conteúdo quando a gaveta está aberta; clique fecha. -->
        <div class="mobile-scrim" id="mobileScrim" hidden></div>
        <noscript>
            <!-- O site é renderizado pelos scripts de js/ e app.js; sem JavaScript nada é exibido. -->
            <div class="error-box" role="alert">
                <b>O JavaScript é obrigatório neste site.</b><br />Ative o JavaScript no navegador para carregar a
                biblioteca de dados do Ragnarök Atlas.
            </div>
        </noscript>
        <script src="js/base.js?v=353eef74" defer></script>
        <script src="js/dados.js?v=26096882" defer></script>
        <script src="js/tabelas.js?v=9bafb7a0" defer></script>
        <script src="js/diarias.js?v=a7eb1fd6" defer></script>
        <script src="js/calculadoras.js?v=a2b9aa5f" defer></script>
        <script src="js/reciclagem.js?v=f33b0ae9" defer></script>
        <script src="js/refino-grau.js?v=2216c26f" defer></script>
        <script src="js/reforma.js?v=7bb5c3e9" defer></script>
        <script src="js/guia.js?v=a7414596" defer></script>
        <script src="js/telas.js?v=c8914144" defer></script>
        <script src="js/ui.js?v=84c2ca32" defer></script>
        <script src="app.js?v=3ea95aef" defer></script>
    </body>
</html>
