name: CI

on:
    pull_request:
    push:
        branches: [main]

# Menor privilégio: a CI só lê o repositório (não grava, não abre PR).
permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: 24

            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
              with:
                  python-version: "3.12"

            - name: Install deps
              run: npm ci

            - name: Syntax-check JavaScript
              run: npm run check

            - name: Cache versions up to date
              run: npm run versao:verificar

            - name: Lint (ESLint)
              run: npm run lint

            - name: Format (Prettier)
              run: npm run format:check

            - name: Validate data schema
              run: npm run validar:dados

            - name: Tests (data validator)
              run: npm test

            - name: Render smoke test (jsdom)
              run: npm run snapshot -- --verificar

            - name: Tests (Python tools)
              run: python -m unittest discover -s tools -p "test_*.py"

            - name: Validate JSON
              run: |
                  set -euo pipefail
                  find . -path ./node_modules -prune -o -name '*.json' -print0 | while IFS= read -r -d '' f; do
                    node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
                    echo "OK $f"
                  done
