name: Puxar efeitos Divine Pride

on:
    workflow_dispatch:
        inputs:
            delay:
                description: "Pausa entre requisições em segundos (padrão 1.2)"
                required: false
                default: "1.2"

# contents: write — checkout e criação da branch com os dados;
# pull-requests: write — abrir/atualizar o PR automático.
permissions:
    contents: write
    pull-requests: write

# Rodadas do mesmo script nunca se atropelam: se uma rodar enquanto outra
# ainda está em andamento, a nova fica na fila (não cancela a atual).
concurrency:
    group: divine-pride
    cancel-in-progress: false

jobs:
    puxar:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Rodar o script (usa o segredo DP_API_KEY, nunca impresso no log)
              env:
                  DP_API_KEY: ${{ secrets.DP_API_KEY }}
              run: python3 tools/puxar_efeitos_divine_pride.py --delay "${{ inputs.delay || '1.2' }}"

            - name: Gerar o corpo do PR (resumo dos itens baixados)
              run: |
                  python3 - <<'PY' > corpo-pr.md
                  import json
                  from datetime import date
                  from pathlib import Path

                  def carregar(caminho):
                      p = Path(caminho)
                      return json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}

                  saida = carregar("tools/cache/divine_pride_saida.json")
                  skills = carregar("tools/cache/divine_pride_skills.json")
                  com_efeito = sum(1 for v in saida.values() if v.get("efeito"))
                  por_busca = sum(1 for v in saida.values() if v.get("busca"))
                  skills_ok = sum(1 for v in skills.values() if v.get("cru"))
                  pendentes_itens = [
                      (v.get("encantamento") or k, v.get("nome_busca") or "")
                      for k, v in saida.items() if not v.get("efeito")
                  ]
                  linhas = [
                      "Atualização automática da saída da API Divine Pride "
                      "(efeitos de encantamento do Episódio 17.2/18).",
                      "",
                      "## Resumo",
                      f"- Data: {date.today().isoformat()}",
                      f"- Itens com efeito salvo: {com_efeito}",
                      f"- Itens resolvidos por busca (conferir manualmente): {por_busca}",
                      f"- Habilidades com detalhe salvo: {skills_ok}",
                  ]
                  if pendentes_itens:
                      linhas += ["", "## Pendências (item sem efeito no cache)"]
                      for nome, busca in sorted(pendentes_itens):
                          linhas.append(f"- {nome}" + (f" (nome de busca: {busca})" if busca else ""))
                  print("\n".join(linhas))
                  PY

            - name: Abrir/atualizar o PR automático com a saída
              uses: peter-evans/create-pull-request@v7
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: data/divine-pride
                  base: main
                  commit-message: "tooling: saída da API Divine Pride (efeitos de encantamento)"
                  title: "tooling: saída da API Divine Pride (efeitos de encantamento)"
                  body-path: corpo-pr.md
                  add-paths: |
                      tools/cache/divine_pride_saida.json
                      tools/cache/divine_pride_faltando.txt
                      tools/cache/divine_pride_skills.json
                      tools/cache/divine_pride_skills_faltando.txt
                  labels: |
                      data
                      automated
