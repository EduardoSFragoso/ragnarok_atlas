# TESTE DESCARTÁVEL — apagar depois de usar (veja o handoff.md §5.1).
# Abre um PR com o GITHUB_TOKEN, igual ao fluxo puxar-efeitos-divine-pride, para conferir
# se a CI roda nele.
name: Teste PR com GITHUB_TOKEN (apagar depois)

on: workflow_dispatch

permissions:
    contents: write
    pull-requests: write

jobs:
    teste:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Criar uma mudança qualquer
              run: echo "teste $(date -u +%s)" > teste-pr-token.txt

            - name: Abrir o PR com o GITHUB_TOKEN
              uses: peter-evans/create-pull-request@v8
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: teste/pr-com-github-token
                  commit-message: "teste: PR aberto com GITHUB_TOKEN"
                  title: "TESTE: PR aberto com GITHUB_TOKEN (pode fechar)"
                  body: "Se a CI não rodar neste PR, o fluxo puxar-efeitos terá o mesmo problema."
